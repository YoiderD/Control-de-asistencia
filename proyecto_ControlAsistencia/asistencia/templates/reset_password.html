<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Recuperar contraseña</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container" style="max-width:420px; margin-top:7vh;">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3 text-center">Recuperar contraseña</h4>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for cat, msg in messages %}
              <div class="alert alert-{{ 'warning' if cat=='warning' else ('danger' if cat=='danger' else ('info' if cat=='info' else 'success')) }} py-2">
                {{ msg }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="post" autocomplete="off">
          <div class="mb-3">
            <label for="correo" class="form-label">Correo</label>
            <input id="correo" name="correo" type="email" class="form-control" required value="{{ correo }}">
          </div>
          <button class="btn btn-primary w-100">Enviar enlace</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
