<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Menú Principal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css" />
  <style>
    body {
      background-color: #f8f9fa;
    }
    .menu-container {
      max-width: 400px;
      margin: 8vh auto;
      padding: 2rem;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .menu-button {
      width: 100%;
      margin: 1rem 0;
      padding: 1rem;
      font-size: 1.25rem;
      font-weight: 600;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-salir {
      /* Usamos clase Bootstrap btn-danger, así que aquí solo ancho */
      width: 100%;
    }
    .btn-icon {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>
  <div class="menu-container">
    <h2 class="mb-4">Manejo de Registros y Reportes</h2>
    <!-- Botón Registros -->
    <button type="button" class="btn btn-primary menu-button" data-bs-toggle="modal" data-bs-target="#modalRegistros">
      <i class="fi fi-rr-folder"></i>
      Registros
    </button>
    <!-- Botón Reportes -->
    <button type="button" class="btn btn-success menu-button " data-bs-toggle="modal" data-bs-target="#modalReportes">
      <i class="fi fi-rr-newspaper"></i>
      Reportes
    </button>
    <div class="d-flex justify-content-center mt-4">
      <a href="{{ url_for('logout') }}" class="btn btn-danger">Cerrar Sesión</a>
    </div>
  </div>

  <!-- Modal Registros -->
  <div class="modal fade" id="modalRegistros" tabindex="-1" aria-labelledby="modalRegistrosLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalRegistrosLabel">Opciones de Registros</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body d-flex flex-column gap-3">
          <a href="{{ url_for('usuarios') }}" class="btn btn-outline-primary">Usuarios</a>
          <a href="{{ url_for('alumnos_lista') }}" class="btn btn-outline-primary">Alumnos</a>
          <a href="{{ url_for('personal_lista') }}" class="btn btn-outline-primary">Personal</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Reportes -->
  <div class="modal fade" id="modalReportes" tabindex="-1" aria-labelledby="modalReportesLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalReportesLabel">Opciones de Reportes</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body d-flex flex-column gap-3">
          <a href="{{ url_for('reportes_alumnos') }}" class="btn btn-outline-primary">Alumnos</a>
          <a href="{{ url_for('reportes_personal') }}" class="btn btn-outline-primary">Personal</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
